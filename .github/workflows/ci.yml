name: Evaluation Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: go build ./...

      - name: Run unit tests
        run: go test ./...

  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run Go Vet
        run: go vet ./...

  sca:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          vuln-type: 'library'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

  sast:
    name: Source Code Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.30.0
        with:
          args: '-severity high ./...'

  docker-security:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest

    needs:
      - build-test
      - lint
      - sca
      - sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t togglemaster-evaluation:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'togglemaster-evaluation:${{ github.sha }}'
          scanners: 'vuln'
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "togglemaster-evaluation:${IMAGE_TAG}" \
            "${REGISTRY}/togglemaster-evaluation:${IMAGE_TAG}"

          docker push "${REGISTRY}/togglemaster-evaluation:${IMAGE_TAG}"

  update-gitops:
    name: Update GitOps Image SHA
    needs: docker-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: carol-goncalves/togglemaster-fase2
          ref: feat/gitops-kind
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update Evaluation image and push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            git fetch origin feat/gitops-kind
            git reset --hard origin/feat/gitops-kind

            python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("gitops/overlays/eks/kustomization.yaml")
          content = path.read_text()

          image = "698126163746.dkr.ecr.us-east-1.amazonaws.com/togglemaster-evaluation"
          pattern = (
              r"(^[ \t]*newName:[ \t]*"
              + re.escape(image)
              + r"[ \t]*\n[ \t]*newTag:[ \t]*)[^\s#]+"
          )

          updated, count = re.subn(
              pattern,
              lambda match: match.group(1) + os.environ["IMAGE_TAG"],
              content,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise SystemExit(f"Esperava 1 imagem Auth, encontrei {count}")

          path.write_text(updated)
          PY

            git add gitops/overlays/eks/kustomization.yaml

            if git diff --cached --quiet; then
              echo "SHA já atualizado."
              exit 0
            fi

            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore(gitops): update evaluation to ${IMAGE_TAG}"

            if git push origin HEAD:feat/gitops-kind; then
              echo "GitOps atualizado com sucesso!"
              exit 0
            fi

            sleep "$((attempt * 2))"
          done

          echo "Falha ao atualizar GitOps."
          exit 1
